<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF2D55" />
    <title>Srdce pro Michaelku</title>
    <style>
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f2f2f7;
        color: #1c1c1e;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100% - 32px, 420px);
        text-align: center;
        background: #fff;
        border: 1px solid #e5e5ea;
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 18px 50px rgb(15 23 42 / 0.12);
      }
      .heart {
        color: #ff2d55;
        font-size: 44px;
        line-height: 1;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: #636366;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="heart">♥</div>
      <h1>Jsi offline</h1>
      <p>Aplikace je pripravena jako PWA. Pripoj se znovu a spolecne vzpominky se nactou.</p>
    </main>
  </body>
</html>
